<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guideline Cards Prototype</title>
<style>
/* Layout: step bar on top, one working panel, cards of the current stage below it. Core cards carry a dark border, as in Figures 1 and 2 of the guide. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#17212b; --muted:#5a6672; --line:#d5dbe1; --line-strong:#17212b;
  --accent:#0d6a72; --accent-soft:#dcefef; --accent-fg:#ffffff; --warn:#8a5a00; --warn-soft:#fbefd2;
  --ok:#17663a; --field:#fbfcfd; --ctl:#7a8794;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --font-mono:ui-monospace,'Cascadia Mono',Consolas,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f161c; --surface:#17212a; --fg:#e8edf1; --muted:#9aa7b2; --line:#2b3945; --line-strong:#e8edf1;
  --accent:#58c2c9; --accent-soft:#16363a; --accent-fg:#06262a; --warn:#f0c46a; --warn-soft:#3a2e12;
  --ok:#6fd49a; --field:#101920; --ctl:#7f909d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f161c; --surface:#17212a; --fg:#e8edf1; --muted:#9aa7b2; --line:#2b3945; --line-strong:#e8edf1;
  --accent:#58c2c9; --accent-soft:#16363a; --accent-fg:#06262a; --warn:#f0c46a; --warn-soft:#3a2e12;
  --ok:#6fd49a; --field:#101920; --ctl:#7f909d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:980px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
h1{font-size:22px;line-height:1.2;margin:0;font-weight:600;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;max-width:62ch;margin:4px 0 0}
.tools{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:7px 12px;border-radius:6px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:500}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.steps{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:16px}
nav.steps button{flex:0 0 auto;display:flex;gap:8px;align-items:center;padding:8px 12px;white-space:nowrap}
nav.steps .n{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
nav.steps button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
nav.steps button[aria-current="step"] .n{color:inherit}
nav.steps .done::after{content:"\2713";color:var(--ok);font-size:12px}
nav.steps button[aria-current="step"].done::after{color:inherit}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px;display:grid;gap:16px}
.panel h2{margin:0;font-size:18px;font-weight:600}
.q{font-size:16px;margin:0;color:var(--fg)}
.hint{margin:0;color:var(--muted);font-size:13px}
label{display:block;font-weight:500;font-size:13px;margin-bottom:4px}
textarea,input[type=text],select{width:100%;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--ctl);border-radius:6px;padding:8px 10px}
textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:640px){.grid2,.grid3{grid-template-columns:1fr}}
.row{display:grid;gap:6px;min-width:0}
.matrix{display:grid;gap:8px}
.mrow{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid var(--line);border-radius:6px;padding:10px 12px;cursor:pointer;background:var(--field)}
.mrow.sel{border-color:var(--accent);background:var(--accent-soft)}
.mrow.off{cursor:default}
.mrow.off b,.mrow.off small{color:var(--muted)}
.mrow b{font-weight:600}
.mrow small{display:block;color:var(--muted);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-family:var(--font-mono);font-size:12px;border:1px solid var(--line);border-radius:4px;padding:1px 6px;background:var(--surface)}
.tag.rec{border-color:var(--accent);color:var(--accent)}
.box{background:var(--accent-soft);border-radius:6px;padding:10px 12px;font-size:14px}
.warn{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:8px 12px;font-size:13px}
h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:8px 0 0;font-weight:600}
details.card{border:1px solid var(--line);border-radius:6px;background:var(--surface)}
details.card.core{border:2px solid var(--line-strong)}
details.card>summary{cursor:pointer;padding:10px 12px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;list-style:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:"\25B8";color:var(--muted)}
details.card[open]>summary::before{content:"\25BE"}
.gc{font-family:var(--font-mono);font-weight:500}
.badge{font-size:11px;border-radius:10px;padding:1px 8px;border:1px solid var(--line);color:var(--muted)}
.badge.core{border-color:var(--line-strong);color:var(--fg);font-weight:600}
.badge.rec{border-color:var(--accent);color:var(--accent)}
.badge.bad{border-color:var(--warn);color:var(--warn)}
.cbody{padding:4px 14px 14px;display:grid;gap:10px;font-size:14px}
.cbody p{margin:0}
.ex{font-style:italic;color:var(--muted)}
.use{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:500;font-size:13px}
.use input{width:20px;height:20px;margin:0}
.use{min-height:28px}
.cardwrap{position:relative}
.cardwrap.hasuse>.use{position:absolute;right:12px;top:8px;z-index:1}
.cardwrap.hasuse details.card>summary{padding-right:150px}
@media (max-width:640px){.cardwrap.hasuse{display:flex;flex-direction:column}.cardwrap.hasuse details.card>summary{padding-right:12px}.cardwrap.hasuse details.card{border-radius:6px 6px 0 0}.cardwrap.hasuse>.use{position:static;order:2;align-self:stretch;margin-left:0;border:1px solid var(--line);border-top:0;border-radius:0 0 6px 6px;background:var(--surface);padding:8px 12px}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.notice{margin:10px 0;padding:10px 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--warn-soft);color:var(--fg);font-size:14px}
.notice button{margin-left:6px}
.startrow{margin:14px 0 4px}
details.more{margin:14px 0;border-top:1px solid var(--line)}
.decision textarea.short{min-height:44px}
details.opt{margin-top:8px}
details.opt>summary{cursor:pointer;padding:6px 0;font-size:14px;color:var(--accent);list-style:none}
details.opt>summary::-webkit-details-marker{display:none}
details.opt>summary::before{content:"\25B8\00a0";color:var(--muted)}
details.opt[open]>summary::before{content:"\25BE\00a0"}
details.more>summary{cursor:pointer;padding:12px 0;font-weight:600;color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px;margin:0}
.chk input{width:auto;margin-top:4px}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
pre{white-space:pre-wrap;word-break:break-word;font-family:var(--font-mono);font-size:13px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:14px;margin:0;max-height:560px;overflow:auto}
.missing{margin:0;padding-left:18px;font-size:14px}
.note{font-size:12px;color:var(--muted)}
.lead{font-size:16px;margin:0;max-width:68ch}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.three{grid-template-columns:1fr}}
.fact{border:1px solid var(--line);border-radius:6px;padding:12px 14px;background:var(--field);min-width:0}
.fact b{display:block;margin-bottom:2px}
.fact p{margin:0;font-size:14px;color:var(--muted)}
.flow{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.flow button{width:100%;text-align:left;display:grid;grid-template-columns:34px minmax(0,1.4fr) minmax(0,1fr);gap:6px 14px;align-items:center;padding:10px 12px;background:var(--field)}
@media (max-width:640px){.flow button{grid-template-columns:34px minmax(0,1fr)}.flow .cs{grid-column:2}}
.flow .num{font-family:var(--font-mono);font-weight:500;width:28px;height:28px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-size:13px}
.flow .nm{font-weight:600;display:block}
.flow .qq{color:var(--muted);font-size:13px;display:block}
.flow .cs{display:flex;flex-wrap:wrap;gap:5px}
.tag.core{border:2px solid var(--line-strong);font-weight:500}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.terms{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;margin:0;font-size:14px}
.terms dt{font-weight:600}.terms dd{margin:0;color:var(--muted)}
@media (max-width:560px){.terms{grid-template-columns:1fr}.terms dd{margin-bottom:6px}}
.dlg{display:grid;gap:6px;font-size:14px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
.dlg p{margin:0}.dlg .who{font-weight:600}

nav.steps{flex-wrap:wrap;overflow:visible}
.tag{white-space:nowrap}
.help{display:block;font-size:12px;color:var(--muted);margin:-2px 0 2px}
.plist{display:grid;gap:8px}
.phead{display:grid;grid-template-columns:1fr 1fr 78px;gap:8px;font-size:12px;font-weight:500;color:var(--muted)}
.prow{display:grid;grid-template-columns:1fr 1fr 78px;gap:8px;align-items:start}
.prow textarea{min-height:56px}
button.ghost{border-color:transparent;color:var(--muted)}
@media (max-width:640px){.phead{display:none}.prow{grid-template-columns:1fr}.prow button.ghost{justify-self:start}}
.badge.ok{border-color:var(--ok);color:var(--ok)}
.badge.todo{border-color:var(--warn);color:var(--warn)}
button[data-tickrec]{margin-left:6px;padding:3px 10px;font-size:13px}
.hint button{vertical-align:baseline}
.pc{display:grid;gap:3px;min-width:0}.pl{display:none;font-size:12px;color:var(--muted)}
@media (max-width:640px){.pl{display:block}}
.pc textarea{min-height:56px}
@media (max-width:640px){nav.steps{flex-wrap:nowrap;overflow-x:auto}header .tools{gap:6px}header .tools button{padding:6px 10px;font-size:14px}h1{font-size:20px}header .sub{font-size:13px}}

.linked{margin:10px 0;padding:10px 12px;border:1px dashed var(--ctl);border-radius:6px;background:var(--accent-soft)}
.linked pre{white-space:pre-wrap;font:inherit;margin:6px 0;color:var(--fg)}
.linked.gap{background:var(--warn-soft);border-style:solid}
.trow{padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.trow.todo{border-left:4px solid var(--warn)}
.trow .tdesign{margin:6px 0 0 30px;font-size:14px}
.trow .tdesign pre{white-space:pre-wrap;font:inherit;margin:2px 0 0}
.gapmsg{color:var(--fg);font-weight:500}
ol.todo{margin:6px 0 6px 18px;padding:0}
button.lnk{border:0;background:transparent;color:var(--accent);padding:2px 6px;text-decoration:underline;cursor:pointer}
.figbtn{display:block;width:100%;padding:8px;margin:6px 0;background:#ffffff;border:1px solid var(--line);border-radius:6px;cursor:zoom-in}
.figbtn img{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
#figdlg{width:min(96vw,1300px);max-height:94vh;padding:0;border:1px solid var(--line-strong);border-radius:8px;background:#ffffff;color:#17212b}
#figdlg::backdrop{background:rgba(0,0,0,.55)}
#figdlg .figbar{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 12px;background:#ffffff;border-bottom:1px solid #d5dbe1}
#figdlg .figbar span{font-size:13px;color:#5a6672}
#figdlg img{display:block;width:100%;min-width:900px;height:auto}
#figdlg .figscroll{overflow:auto;max-height:calc(94vh - 52px)}
@media print{.figbtn{break-inside:avoid}}
</style>
</head>
<body>


<div class="wrap">
<header>
  <div>
    <h1>Guideline Cards Prototype</h1>
    <p class="sub">An interactive version of the lecturer guide for designing one educational chatbot conversation.</p>
  </div>
  <div class="tools">
    <button id="btn-example" type="button">Load example</button>
    <button id="btn-save" type="button">Save to file</button>
    <button id="btn-load" type="button">Load from file</button>
    <input type="file" id="file-in" accept=".json,application/json" hidden>
    <button id="btn-reset" type="button">Start empty</button>
  </div>
</header>
<div id="live" class="sr" role="status" aria-live="polite"></div>
<div id="notice" class="notice" role="status" hidden></div>
<nav class="steps" id="stepbar" aria-label="Steps"></nav>
<main id="main"></main>
</div>

function introHtml(){
 const FL=[
  ['Purpose definition','What should students be able to do after the conversation, and what will they do in it?',['GC-01*']],
  ['Learner situation analysis','What do students already know, which misconceptions are typical, and which teaching method fits?',['GC-02*','GC-03']],
  ['Conversation role selection','Which role does the chatbot take?',['GC-04*']],
  ['Dialogue flow design','In which order does the conversation run?',['GC-05','GC-06','GC-07','GC-08','GC-09']],
  ['Feedback and repair planning','What happens after a correct, incorrect, misconceived or unclear answer?',['GC-12*','GC-07','GC-10','GC-11','GC-13']],
  ['Boundary definition','What does the chatbot refuse, and where does it send students?',['GC-14*']],
  ['Review','Is the design ready to be used?',['Checklist']]];
 const chip=c=>c.endsWith('*')?`<span class="tag core">${c.slice(0,-1)}</span>`:`<span class="tag">${c}</span>`;
 return `<h2>Design one chatbot conversation for your course</h2>
 <p class="lead">This guide helps you, as a lecturer, to plan how a chatbot should talk with your students about one learning objective. You do not build the chatbot and you do not need technical knowledge. You describe what it should do, step by step. The result is a conversation design specification that you can hand to whoever sets up the chatbot.</p>
 <div class="three">
  <div class="fact"><b>What you need</b><p>One learning objective from a course you teach, your course material, and the mistakes students typically make in this topic.</p></div>
  <div class="fact"><b>What you do</b><p>Answer one question in each of seven steps. In every step, guideline cards (GC) tell you what to decide.</p></div>
  <div class="fact"><b>What you get</b><p>A completed worksheet that you can copy as text: the conversation order, the cards you chose and the values for your course.</p></div>
 </div>
 <div class="tools startrow"><button type="button" class="primary" data-go="0">Start with step 1</button><button type="button" data-example="1">Try it with the example first</button></div>
 <h3>The seven steps</h3>
 <p class="hint">Select a step to jump to it. The cards shown for each step are the rules you will meet there.</p>
 <ol class="flow">${FL.map((s,k)=>`<li><button type="button" data-go="${k}"><span class="num">${k+1}</span><span><span class="nm">${s[0]}</span><span class="qq">${s[1]}</span></span><span class="cs">${s[2].map(chip).join('')}</span></button></li>`).join('')}</ol>
 <div class="legend"><span><span class="tag core">GC-01</span> Core card. You use it in every design.</span><span><span class="tag">GC-03</span> Selectable card. The selection matrix in step 2 recommends it or not.</span></div>
 <details class="more"><summary>Read more: how the cards work, an example conversation and the terms</summary>
 <h3>How the cards work</h3>
 <p>The framework has 14 guideline cards (GC-01 to GC-14). Each card is a short rule for one move of the chatbot, for example how it opens, how it gives a hint or how it refuses a request. A card says when to use it, what the chatbot does, its limits and what you decide. Five cards are core cards and apply in every design. The other nine are selectable, and you choose them with the selection matrix. Each card is a ready-made rule. When you tick it, you fill it in for your course, and only the cards you filled in end up in your specification.</p>
 <h3>What a conversation looks like</h3>
 <p class="hint">An excerpt from the constructed example in the guide. Students model an order process in BPMN with the chatbot, one modelling step at a time. “Step 3” here is the third modelling step and not step 3 of this guide. The cards used in each chatbot turn are shown next to it.</p>
 <div class="dlg"><p><span class="who">Chatbot:</span> “Now step 3. What happens after ‘Check stock’?” <span class="tag">GC-05</span></p><p><span class="who">Student:</span> “Next comes the task ‘Ship order’.”</p><p><span class="who">Chatbot:</span> “‘Ship order’ is right for one case. You are close. What happens if the product is not in stock?” <span class="tag">GC-13</span> <span class="tag">GC-10</span></p><p><span class="who">Student:</span> “Then the order is cancelled, so there are two ways.”</p><p><span class="who">Chatbot:</span> “Exactly, two ways. The split into the two ways is still missing. Which element creates it?” <span class="tag">GC-13</span> <span class="tag">GC-10</span></p></div>
 <h3>Terms used in the steps</h3>
 <dl class="terms">
  <dt>Chatbot</dt><dd>A text-based assistant that talks with students in writing. It can run on a language model or on fixed rules. The guide does not depend on a tool.</dd>
  <dt>Learning objective</dt><dd>What students should be able to do after the conversation, written with a verb such as explain, implement or critique.</dd>
  <dt>Selection matrix</dt><dd>A table in step 2. You pick the row that matches the main purpose of your conversation. The row gives the teaching method, the roles and the recommended cards.</dd>
  <dt>Teaching method</dt><dd>${Object.keys(METHODDESC).map(k=>`<b>${k}.</b> ${METHODDESC[k]}`).join(' ')}</dd>
  <dt>Role</dt><dd>${ROLES.map(k=>`<b>${k}.</b> ${ROLEDESC[k]}`).join(' ')} You choose one in step 3.</dd>
  <dt>Misconception</dt><dd>A mistake that students typically make in this topic.</dd>
  <dt>Counterexample</dt><dd>A case in which the wrong belief does not hold. The chatbot uses it to make students rethink.</dd>
  <dt>Course details</dt><dd>The decision that you write in every card you use. You can add an example from your course and a note, but you do not have to. The thesis calls them instance fields.</dd>
 </dl>
 </details>
 <p class="note">Based on the lecturer guide of a master thesis at the FHNW School of Business. The descriptions of roles and teaching methods come from the framework document. This is a prototype. Your entries stay in this browser and are not sent anywhere. The example is a constructed scenario, not a tested chatbot design.</p>`}
function missing(){const m=[];
 if(!S.objective.trim())m.push('Step 1: learning objective');if(!S.activity.trim())m.push('Step 1: student activity');
 if(S.row<0)m.push('Step 2: row of the selection matrix');if(!isReflective()&&!filled('misc').length)m.push('Step 2: misconceptions with counterexamples');
 if(!S.role)m.push('Step 3: role');if(!S.opening.trim())m.push('Step 3: opening sentence');
 if(!S.order.trim())m.push('Step 4: order of the conversation');
 if(!S.r_unclear.trim())m.push('Step 5: response to an unclear input');
 if(isReflective()){if(!S.criterion.trim())m.push('Step 5: criterion for reflection');if(!S.r_incorrect.trim())m.push('Step 5: response to an unsupported judgement');if(!S.r_action.trim())m.push('Step 5: response to an action whose consequences the student has not evaluated')}
 else{if(!S.r_misc.trim())m.push('Step 5: response to a listed misconception');if(!S.r_incorrect.trim())m.push('Step 5: response to an incorrect answer');if(!S.r_correct.trim())m.push('Step 5: response to a correct answer')}
 if(!filled('bound').length)m.push('Step 6: requests outside the role');
 const nc=CARDS.filter(c=>isUsed(c)&&needsBoxes(c)&&!detailsDone(c.id)).map(c=>c.id);
 if(nc.length)m.push('Your decision for '+nc.join(', ')+' (open the card in its step)');
 const n=CHECKS.filter((_,k)=>!SPECCK.includes(k)&&!S.checks[k]).length;if(n)m.push(`Step 7: ${n} review question${n>1?'s':''} still open`);
 const n2=SPECCK.filter(k=>!S.checks[k]).length;if(n2)m.push(`Below the specification: ${n2} review question${n2>1?'s':''} still open`);
 const nt2=(isReflective()?TESTS_REFL:TESTS_TASK).filter((_,k)=>!S.tests[k]).length;if(nt2)m.push(`Step 7: ${nt2} test input${nt2>1?'s':''} not ticked yet`);
 return m}

function spec(){const r=row();const L=[];const add=(t,v)=>L.push(t+'\n'+(String(v||'').trim()||'(not filled in)')+'\n');
 L.push('CONVERSATION DESIGN SPECIFICATION\n');
 L.push('HOW TO READ THIS SPECIFICATION\nThis document was written by a lecturer. It describes how a chatbot conducts one conversation with students of a university course. If you are the chatbot, follow it. If you are a person building the chatbot, use it as the design. The conversation is built from guideline cards. A guideline card is a short rule for one move of the chatbot, for example how it opens the conversation, how it gives a hint or how it refuses a request. Each selected card is listed at the end with when it applies, what the chatbot does, its limits and the decision of the lecturer for this course. The labels such as GC-05 only name the cards. The chatbot does not mention them to students.\n');
 L.push('1 PURPOSE DEFINITION');add('Learning objective',S.objective);add('Intended student activity',S.activity);
 L.push('2 LEARNER SITUATION ANALYSIS');add('Expected prior knowledge',S.prior);
 add('Typical misconceptions and counterexamples',filled('misc').map(p=>'- '+p.a+(p.b?' (counterexample: '+p.b+')':'')).join('\n')||(isReflective()?'None listed.':''));
 add('Row of the selection matrix and teaching method',r?r.purpose+'. Teaching method: '+r.method:'');
 L.push('3 CONVERSATION ROLE SELECTION');add('Role',S.role+(S.role&&ROLEDESC[S.role]?'. '+ROLEDESC[S.role]:''));add('Opening sentence',S.opening);
 L.push('4 DIALOGUE FLOW DESIGN');add('Order of the conversation',S.order);if(S.steps.trim())add('Steps and expected answers',S.steps);
 L.push('5 FEEDBACK AND REPAIR PLANNING');add('Unclear input',S.r_unclear);
 if(isReflective())add('Criterion for reflection',S.criterion);else add('Listed misconception',S.r_misc);
 add(isReflective()?'Unsupported judgement':'Other incorrect answer',S.r_incorrect);if(isReflective())add('Action whose consequences the student has not evaluated',S.r_action);else add('Correct answer',S.r_correct);
 L.push('6 BOUNDARY DEFINITION');add('Requests outside the role',filled('bound').map(p=>'- '+p.a+(p.b?' -> '+p.b:'')).join('\n'));
 L.push('SELECTED GUIDELINE CARDS\nEach card is a rule for one move of the chatbot. Apply every card where its condition holds.\n');
 L.push(CARDS.filter(isUsed).map(c=>{const v=S.vals[c.id]||{};if(c.id==='GC-02')return c.id+' '+c.name+' (applies in every conversation)\n  Chosen at design time: '+(r?r.method:'(not filled in)')+'. The conversation uses this one main teaching method. Other methods appear only as short branches.';const lk=linkText(c.id).trim();const LK=LINKS[c.id];const va=v.va&&v.va.trim()?v.va.trim():'';const own=LK&&LK.counts!==false&&lk;
   return c.id+' '+c.name+(c.core?' (applies in every conversation)':'')+'\n  Applies when: '+c.when+'\n  What the chatbot does: '+c.does+'\n  Limits: '+c.limits+(lk?'\n  Content: see section '+LK.sec+' ('+LK.secname+') above. It is not repeated here.':'')+(v.ex&&v.ex.trim()?'\n  Example from this course: '+v.ex.trim():'')+(va?'\n  Decision of the lecturer: '+va:(own?'':(DEF[c.id]?'\n  Decision of the lecturer: none given. Default of the card: '+DEF[c.id]:'\n  Decision of the lecturer: (not filled in)')))+(v.no&&v.no.trim()?'\n  Notes: '+v.no.trim():'')}).join('\n\n')+'\n');
 const om=recommended().filter(id=>!S.used[id]);const tl=isReflective()?TESTS_REFL:TESTS_TASK;
 L.push('NOTES FOR THE LECTURER AND DEVELOPER, NOT INSTRUCTIONS TO THE CHATBOT\n\nReview checklist (step 7)\n'+CHECKS.map((q,k)=>(S.checks[k]?'[x] ':'[ ] ')+q).join('\n')+'\n\nTest inputs. Marked when the design describes a response.\n'+tl.map((q,k)=>(S.tests[k]?'[x] ':'[ ] ')+q).join('\n')+'\n');
 if(om.length)L.push('Recommended cards left out\n'+om.map(id=>'- '+id+': '+(S.omit[id]||'(reason not noted)')).join('\n')+'\n');
 return L.join('\n')}

  else if(e.target.id==='ask-no'){askFn=null;hideNotice();const t=document.getElementById('btn-reset');if(t)t.focus()}
  else if(e.target.id==='load-ok'&&pending){S=pending;pending=null;hideNotice();save();render(true);window.scrollTo({top:0})}
  else if(e.target.id==='load-no'){pending=null;hideNotice()}
  else if(e.target.id==='reload'){location.reload()}});
notice.addEventListener('keydown',e=>{if(e.key==='Escape'&&(notice.dataset.k==='ask'||notice.dataset.k==='load')){askFn=null;pending=null;hideNotice()}});
window.addEventListener('storage',e=>{if(e.key===KEY){showNotice('Your entries were changed in another tab of this page. <button type="button" id="reload">Reload to see them</button> If you keep typing here, the other tab’s changes are overwritten.','warn');notice.dataset.k='tab'}});
main.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.f){S[t.dataset.f]=t.value;save();refreshDone();return}
  if(t.dataset.pl){const[k,i,f]=t.dataset.pl.split('|');while(S[k].length<=+i)S[k].push({a:'',b:''});S[k][+i][f]=t.value;save();refreshDone();return}
  if(t.dataset.val){const[a,b]=t.dataset.val.split('|');(S.vals[a]=S.vals[a]||{})[b]=t.value;save();refreshBadge(a);return}
  if(t.dataset.om){S.omit[t.dataset.om]=t.value;save()}});
main.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.row!==undefined){S.row=+t.dataset.row;if(!row().roles.includes(S.role))S.role='';save();render();return}
  if(t.dataset.role){S.role=t.dataset.role;save();render();return}
  if(t.dataset.use){if(t.checked){S.used[t.dataset.use]=1}else delete S.used[t.dataset.use];S.open=t.dataset.use;save();render();return}
  if(t.dataset.ck!==undefined){S.checks[t.dataset.ck]=t.checked;save();refreshDone();refreshReview();refreshSpec();return}
  if(t.dataset.ts!==undefined){S.tests[t.dataset.ts]=t.checked;save();refreshDone();refreshReview()}});
main.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.card){if(d.open)S.open=d.dataset.card}},true);
function refreshBadge(id){const s=document.querySelector('details[data-card="'+id+'"] .badge.status');if(s){const st=statusOf(id);s.className='badge status '+(st.ok?'ok':'todo');s.textContent=st.t}}
function refreshDone(){document.querySelectorAll('#stepbar button[data-go]').forEach(b=>{const k=+b.dataset.go;if(k>=0)b.classList.toggle('done',done(k))})}
render();
(function(){let seen=false;try{seen=sessionStorage.getItem('gc-seen')==='1';sessionStorage.setItem('gc-seen','1')}catch(e){}
  if(!seen&&changed()){showNotice('A design from an earlier visit is still saved in this browser. <button type="button" id="resume-ok">Continue with it</button> <button type="button" id="resume-new">Delete it and start empty</button> On a shared computer, start empty.','warn');notice.dataset.k='resume'}})();
</script>
</body>
</html>
